    <!-- Fonts load here, not via @import in typography.css: an @import inside a
         bundled stylesheet is discovered only after that stylesheet parses, so
         it serialises two round trips in front of first paint. Inter Tight 600
         is the shared display face — BOTH hero layers use it, so a swap moves
         them together and cannot break registration. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Inter+Tight:wght@600&family=Antonio:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@400;500;600;700&display=swap"
    />
